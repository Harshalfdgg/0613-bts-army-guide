<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>0613 — ARMY Guide</title>
<style>
:root{--bg:#fcfbff;--card:#fff;--ink:#302b35;--muted:#817b86;--pink:#b99bd1;--rose:#d9c7e6;--lav:#e8def1;--cream:#faf7fd;--line:#ebe5f0;--shadow:0 12px 30px rgba(82,65,96,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}.app{min-height:100vh;background:radial-gradient(circle at 90% 0,#eee7f5 0,transparent 25%),radial-gradient(circle at 0 45%,#f6f2fa 0,transparent 22%)}
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.navin{max-width:1150px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:8px;overflow:auto}.brand{font-weight:900;letter-spacing:-.04em;margin-right:auto;white-space:nowrap;color:var(--ink);cursor:pointer}.brand span{color:var(--pink)}
.nav button,.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer;color:var(--ink);white-space:nowrap}.nav button:hover,.btn:hover{background:#f7f3fa;transform:translateY(-1px)}
.page{max-width:1150px;margin:auto;padding:28px 18px 55px}.hero{padding:42px 8px 28px;display:grid;grid-template-columns:1.5fr 1fr;gap:28px;align-items:center}
.ey{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--pink);font-weight:900}.hero h1{font-size:clamp(46px,8vw,86px);line-height:.9;letter-spacing:-.07em;margin:14px 0}.hero h1 span{color:var(--pink)}.hero p{color:var(--muted);line-height:1.75;max-width:650px}
.heroCard{background:linear-gradient(145deg,#fff,#f8f4fb);border:1px solid var(--line);border-radius:30px;padding:26px;box-shadow:var(--shadow);transform:rotate(1deg)}.heroCard .big{font-size:64px;font-weight:900;letter-spacing:-.08em}.heroCard small{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);transition:.25s}.card:hover{transform:translateY(-5px);box-shadow:0 20px 38px rgba(116,76,104,.12)}
.card h2,.card h3{margin:7px 0}.muted{color:var(--muted);line-height:1.65}.label{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--pink);font-weight:900}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;color:var(--muted)}
.sectionHead{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:15px 0 20px}.sectionHead h1{font-size:42px;letter-spacing:-.05em;margin:5px 0}.sectionHead p{color:var(--muted);margin:0}
.member{cursor:pointer;text-align:left}.member .initial{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#f3edf8,#e5d8ef);display:grid;place-items:center;font-weight:900;margin-bottom:13px}.member:hover{transform:translateY(-5px)}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.tabs button.active{background:var(--pink);color:#fff;border-color:var(--pink)}
.track{display:flex;gap:10px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}.track b{min-width:100px}.track span{color:var(--muted);line-height:1.55}
.player{display:flex;align-items:center;gap:15px}.cover{width:58px;height:58px;border-radius:17px;background:linear-gradient(135deg,#e6dcef,#f1eaf6);display:grid;place-items:center;font-weight:900}.play{width:42px;height:42px;border:0;border-radius:50%;background:var(--ink);color:#fff;cursor:pointer}
.quote{background:linear-gradient(135deg,#fff,#f8f4fb);border:1px solid var(--line);border-radius:24px;padding:23px;line-height:1.7;font-size:17px}
.quiz button{width:100%;text-align:left;margin:7px 0}.answer{background:#f7f3fa;border:1px solid var(--rose);border-radius:18px;padding:15px;margin-top:12px}
.footer{text-align:center;border-top:1px solid var(--line);padding:30px 10px;color:var(--muted);margin-top:25px}.footer b{color:var(--pink)}
.search{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:16px;outline:none;background:#fff}.search:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(185,155,209,.18)}
@media(max-width:800px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.heroCard{transform:none}}@media(max-width:560px){.grid{grid-template-columns:1fr}.navin{padding-left:12px}.hero{padding-top:25px}}
</style></head><body><div id="app"></div><script>\nconst app=document.getElementById("app");
const members=[
['RM','Kim Namjoon','Leader · rapper · songwriter','mono. · Indigo · Right Place, Wrong Person'],
['Jin','Kim Seokjin','Oldest member · vocalist','The Astronaut · Happy · Echo'],
['SUGA','Min Yoongi','Rapper · producer · Agust D','Agust D · D-2 · D-DAY'],
['j-hope','Jung Hoseok','Rapper · dancer · performer','Hope World · Jack In The Box · HOPE ON THE STREET'],
['Jimin','Park Jimin','Vocalist · dancer · performer','FACE · MUSE'],
['V','Kim Taehyung','Vocalist · performer','Layover · Winter Bear · Sweet Night'],
['Jung Kook','Jeon Jungkook','Youngest member · vocalist · performer','GOLDEN · Seven · 3D · Standing Next to You']
];
const eras=[
['School Trilogy','2013–14','No More Dream · N.O · Boy In Luv','The beginning: ambition, youth and finding a voice.'],
['HYYH','2015–16','I NEED U · RUN · Young Forever','Youth, beauty, uncertainty and the feeling of growing up.'],
['WINGS','2016–17','Blood Sweat & Tears · Spring Day','Growth, temptation, loss and a new visual world.'],
['LOVE YOURSELF','2017–18','DNA · Fake Love · IDOL','Love, heartbreak and learning to love yourself.'],
['MAP OF THE SOUL','2019–20','Boy With Luv · Black Swan · ON','Persona, shadow, identity and the many selves within us.'],
['BE / Pandemic','2020–21','Life Goes On · Butter · Permission to Dance','Music made during an unusual global chapter.'],
['Chapter 2','2022–25','Proof · solo releases · Yet To Come','The members explored individual music while BTS remained OT7.'],
['ARIRANG','2026','Body to Body · NORMAL · Into the Sun','A new full-group chapter after the members reunited.']
];
const songs=[
['Spring Day','WINGS era','HYYH/WINGS'],['I NEED U','Young Forever','HYYH'],['DNA','LOVE YOURSELF: Her','LOVE YOURSELF'],['Fake Love','LOVE YOURSELF: Tear','LOVE YOURSELF'],['Black Swan','MAP OF THE SOUL: 7','MAP OF THE SOUL'],['Life Goes On','BE','Pandemic'],['Yet To Come','Proof','Chapter 2'],['Body to Body','ARIRANG','ARIRANG'],['NORMAL','ARIRANG','ARIRANG']
];
const facts=[
'BTS debuted on June 13, 2013.','ARMY was announced as BTS’s fandom name on July 9, 2013.','HYYH means “The Most Beautiful Moment in Life.”','OT7 means supporting all seven BTS members.','Jung Kook is BTS’s youngest member, or maknae.','0613 refers to BTS’s debut date.','“Apobangpo” is commonly used by ARMY to mean “ARMY forever, BTS forever.”'
];
function nav(active){return '<div class="nav"><div class="navin"><div class="brand" onclick="go(\'home\')">0613 <span>ARMY</span></div>'+['home','members','music','learn','support','fun','magic'].map(x=>'<button class="'+(active==x?'active':'')+'" onclick="go(\''+x+'\')">'+({home:'Home',members:'7 Members',music:'Music',learn:'Learn',support:'Support',fun:'Fun',magic:'Magic Shop'}[x])+'</button>').join('')+'</div></div>'}
function layout(active,content){app.innerHTML=nav(active)+'<main class="page">'+content+'</main><footer class="footer">Made with ♡ for ARMY · <b>made by @kookie_star715</b><br><small>0613 · BTS · ARMY · Borahae · Apobangpo</small></footer>';window.scrollTo({top:0,behavior:'smooth'})}
function go(p){({home:home,members:membersPage,music:musicPage,learn:learnPage,support:supportPage,fun:funPage,magic:magicPage}[p]||home)()}
function home(){
let fact=facts[Math.floor(Math.random()*facts.length)];
layout('home','<section class="hero"><div><div class="ey">your little corner of the purple side</div><h1>0613 — The <span>BTS ARMY</span> Guide</h1><p>A friendly place to learn BTS, explore eras, find songs, understand fandom terms, and discover useful ARMY resources — without one giant endless page.</p><div class="chips"><span class="chip">7 members</span><span class="chip">8 eras</span><span class="chip">music + lore</span><span class="chip">ARMY resources</span></div></div><div class="heroCard"><div class="label">today’s little fact</div><div class="big">0613</div><small>'+fact+'</small><br><button class="btn" onclick="home()">another fact</button></div></section><div class="grid">'+[
['7 Members','Meet each member with a cute interactive card.','members'],['Music Room','Album eras, song cards and a tiny player.','music'],['Learn BTS','History, HYYH, BU, terms and beginner path.','learn'],['Support Hub','Voting, streaming, Last.fm and B-CD resources.','support'],['ARMY Fun','Mini quiz, random fact and little challenges.','fun'],['Magic Shop','A calm corner for comfort, memories and words.','magic']].map(x=>'<button class="card" onclick="go(\''+x[2]+'\')"><div class="label">open room</div><h2>'+x[0]+'</h2><p class="muted">'+x[1]+'</p></button>').join('')+'</div>');
}
function membersPage(){
layout('members','<div class="sectionHead"><div><div class="ey">meet the seven</div><h1>Member Room</h1><p>Tap a card to open a little member profile.</p></div></div><div class="grid">'+members.map((m,i)=>'<button class="card member" onclick="memberCard('+i+')"><div class="initial">'+m[0].replace('j-','J').slice(0,2)+'</div><h2>'+m[0]+'</h2><p class="muted">'+m[1]+'<br>'+m[2]+'</p></button>').join('')+'</div><div id="memberDetail"></div>');
}
function memberCard(i){let m=members[i];document.getElementById('memberDetail').innerHTML='<div class="card" style="margin-top:16px"><div class="label">member card</div><h2>'+m[0]+' · '+m[1]+'</h2><p class="muted">'+m[2]+'</p><div class="chips"><span class="chip">Solo: '+m[3]+'</span><span class="chip">OT7</span><span class="chip">0613</span></div></div>';document.getElementById('memberDetail').scrollIntoView({behavior:'smooth',block:'center'})}
function musicPage(){
layout('music','<div class="sectionHead"><div><div class="ey">press play</div><h1>Music Room</h1><p>Browse songs by era and use the cards as your listening trail.</p></div></div><input class="search" placeholder="Search a song or era..." oninput="filterSongs(this.value)"><div id="songGrid" class="grid2" style="margin-top:15px"></div>');filterSongs('');
}
function filterSongs(q){let a=songs.filter(s=>s.join(' ').toLowerCase().includes(q.toLowerCase()));document.getElementById('songGrid').innerHTML=a.map(s=>'<div class="card player"><div class="cover">♪</div><div style="flex:1"><b>'+s[0]+'</b><div class="muted">'+s[1]+' · '+s[2]+'</div></div><button class="play" onclick="this.textContent=this.textContent==='▶'?'Ⅱ':'▶'">▶</button></div>').join('')}
function learnPage(){
layout('learn','<div class="sectionHead"><div><div class="ey">no homework required</div><h1>Learn BTS</h1><p>Small rooms instead of endless scrolling.</p></div></div><div class="grid2"><div class="card"><div class="label">beginner path</div><h2>7 little steps</h2><div class="track"><b>01</b><span>Meet the 7 members</span></div><div class="track"><b>02</b><span>Pick an era that catches your eye</span></div><div class="track"><b>03</b><span>Listen to a few anchor songs</span></div><div class="track"><b>04</b><span>Try Run BTS! or another BTS variety show</span></div><div class="track"><b>05</b><span>Learn common ARMY terms</span></div><div class="track"><b>06</b><span>Explore HYYH + BU when you feel curious</span></div><div class="track"><b>07</b><span>Explore solo work and make your own path</span></div></div><div class="card"><div class="label">dictionary</div><h2>Quick ARMY words</h2><p class="muted"><b>OT7</b> · all seven members<br><b>bias</b> · your favorite member<br><b>maknae</b> · youngest member<br><b>comeback</b> · a new release/promotion period<br><b>HYYH</b> · The Most Beautiful Moment in Life<br><b>BU</b> · BTS Universe, a fictional story world connected to selected works<br><b>daesang</b> · a grand-prize category at major Korean awards</p></div></div><h2 style="margin-top:32px">Era Gallery</h2><div class="grid">'+eras.map(e=>'<div class="card"><div class="label">'+e[1]+'</div><h2>'+e[0]+'</h2><p><b>'+e[2]+'</b></p><p class="muted">'+e[3]+'</p></div>').join('')+'</div>');
}
function supportPage(){
layout('support','<div class="sectionHead"><div><div class="ey">helpful, not overwhelming</div><h1>ARMY Support Hub</h1><p>Guides change, so always check the linked source for the current schedule.</p></div></div><div class="grid2"><div class="card"><div class="label">voting</div><h2>Vote with a plan</h2><p class="muted">Music-show voting can use different apps, schedules and point systems. FandomName’s BTS ARMY page currently lists voting apps/tutorials, including Mnet Plus, coogoong, Mubeat, Muniverse, LiNC, tin, Higher and Idol Champ, with details that can change.</p><a class="btn" href="https://fandomname.com/BTSarmy/11341" target="_blank">FandomName voting guide ↗</a> <a class="btn" href="https://linktr.ee/btsxarmyvotingteam" target="_blank">ARMY Voting Team ↗</a></div><div class="card"><div class="label">streaming</div><h2>Stream properly</h2><p class="muted"><b>YouTube:</b> use the official MV, watch like a real viewer, and avoid bots, view-boosting services or artificial traffic. YouTube says artificial engagement may not count and can lead to enforcement.</p><p class="muted"><b>Spotify:</b> listen normally from your own account. Avoid bots, scripts, paid “guaranteed streams,” or services promising playlist placement. Spotify says artificial streams can be removed from public counts/charts and can trigger penalties.</p><p class="muted"><b>Apple Music:</b> use the official song/album and listen normally from your account. Don’t use automation or traffic services. For any current fan-project playlist rules, follow the project's latest instructions rather than old screenshots.</p><p class="muted"><b>Golden rule:</b> genuine listening beats trying to game a counter. You don't need to stream 24/7.</p></div><div class="card"><div class="label">last.fm</div><h2>Why ARMYs use it</h2><p class="muted">Last.fm records your listening as <b>scrobbles</b>. It is useful for building a personal BTS listening history, seeing your most-played songs/albums, and checking your own listening habits. It is a tracking tool — not a replacement for the official streaming platform's own counts.</p><a class="btn" href="https://www.last.fm/" target="_blank">Open Last.fm ↗</a> <a class="btn" href="https://x.com/styxletters/status/1980856515708834245" target="_blank">Tutorial post ↗</a></div><div class="card"><div class="label">B-CD</div><h2>A joyful ARMY project</h2><p class="muted">B-CD can be a helpful place for ARMYs who enjoy organized support projects, tracking and community activities. It can make streaming/support feel more social and fun instead of doing everything alone. Check the project’s current instructions and participate only in ways that feel comfortable for you.</p><a class="btn" href="https://youtu.be/8Ixup0Iy2RM?si=0SCuwDZzB7ChbsHn" target="_blank">Watch the B-CD guide ↗</a></div></div><div class="quote" style="margin-top:18px">♡ You are not a “better” ARMY because you stream more or vote more. Support should stay genuine, safe and enjoyable.</div>');
}
function funPage(){
layout('fun','<div class="sectionHead"><div><div class="ey">play a little</div><h1>ARMY Fun Room</h1><p>No scores to prove anything. Just silly little BTS things.</p></div></div><div class="grid2"><div class="card quiz"><div class="label">mini quiz</div><h2>What kind of ARMY are you?</h2><p class="muted">Pick what sounds most like you.</p><button class="btn" onclick="quiz(0)">A · I live for music + playlists</button><button class="btn" onclick="quiz(1)">B · Lore has trapped me</button><button class="btn" onclick="quiz(2)">C · Give me Run BTS! chaos</button><button class="btn" onclick="quiz(3)">D · I collect facts about everything</button><div id="quizAnswer"></div></div><div class="card"><div class="label">random fact machine</div><h2>Tell me something BTS</h2><p id="fact" class="quote">'+facts[0]+'</p><button class="btn" onclick="newFact()">another one</button></div></div>');
}
function quiz(i){let a=['The Playlist ARMY — you turn feelings into a soundtrack.','The Lore ARMY — one mysterious frame and suddenly it is 3 a.m.','The Chaos ARMY — laughter first, explanations later.','The Encyclopedia ARMY — you somehow know the date, album and context.'];document.getElementById('quizAnswer').innerHTML='<div class="answer">'+a[i]+'</div>'}
function newFact(){document.getElementById('fact').textContent=facts[Math.floor(Math.random()*facts.length)]}
function magicPage(){
layout('magic','<div class="sectionHead"><div><div class="ey">a tiny safe corner</div><h1>Magic Shop</h1><p>Come in when you want something softer.</p></div></div><div class="quote">“You are not alone.”<br><small>Let this be a place to pause, listen to a favorite song, write something down, or simply breathe.</small></div><div class="grid2"><div class="card"><div class="label">little ritual</div><h2>Make your own Magic Shop moment</h2><p class="muted">Put on a comfort BTS song. Make chai or ramen. Turn the lights low. Write one thing that made you smile today. Then leave your phone alone for a few minutes.</p></div><div class="card"><div class="label">ARMY note</div><h2>There is no “correct” way to love BTS.</h2><p class="muted">You can be here for the music, performances, lyrics, friendships, memories, comfort, or all of it. Take what makes you happy and leave the pressure behind.</p></div></div>');
}
home();
</script></body></html>
