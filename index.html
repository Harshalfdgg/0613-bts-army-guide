<!doctype html>
<html lang="en">
<head>

<title>0613 — The BTS ARMY Guide</title>
<style>
:root{--bg:#fffdfd;--card:#fff;--soft:#faf4fc;--ink:#302735;--muted:#7d7383;--line:#eee4f1;--a:#8e68b5;--a2:#b99bd1;--shadow:0 14px 35px rgba(90,55,110,.07)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--bg)}button,input{font:inherit}.app{min-height:100vh;background:radial-gradient(circle at 90% 0%,#eadcf2 0,transparent 28%),var(--bg)}header,.wrap{max-width:1120px;margin:auto;padding:24px 20px}.hero{padding:35px 0 25px}.ey{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--a2);font-weight:800}.ey:before{content:"✦ "}.hero h1{font-size:clamp(42px,8vw,78px);line-height:.94;letter-spacing:-.05em;margin:15px 0}.hero h1 span{color:var(--a)}.hero p{max-width:720px;color:var(--muted);line-height:1.7}.tags{display:flex;gap:8px;flex-wrap:wrap}.tag,.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;color:var(--muted);font-size:12px}.controls{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px}.search{flex:1;min-width:230px;padding:14px;border:1px solid var(--line);border-radius:15px;outline:none}.pill{cursor:pointer;color:var(--ink)}.pill:hover{border-color:var(--a2)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,.result,.post,.member,.feature{border:1px solid var(--line);background:linear-gradient(145deg,#fff,var(--soft));border-radius:21px;padding:20px;box-shadow:var(--shadow)}.card{min-height:165px;cursor:pointer;transition:.2s}.card:hover,.feature:hover,.result:hover{transform:translateY(-3px);border-color:var(--a2)}.num{font-size:11px;color:var(--a2);font-weight:900;letter-spacing:.14em}.card h2{font-size:19px;margin:12px 0 8px}.card p,.result p,.post p,.member span,.feature span{color:var(--muted);line-height:1.6;font-size:14px}.reader{max-width:900px;margin:auto;padding:20px 20px 70px}.back{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;cursor:pointer;margin-bottom:22px}.reader h1{font-size:clamp(35px,7vw,60px);line-height:1;margin:0 0 10px}.reader .intro{color:var(--muted);line-height:1.7}.post{margin:12px 0}.post h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--a2);margin:0 0 8px}.membergrid,.features,.support{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.member strong,.feature b{display:block;font-size:17px;margin-bottom:7px}.timeline .post{border-left:3px solid var(--a2)}.tracker{display:grid;gap:9px;margin-top:18px}.track{display:flex;gap:10px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}.track input{accent-color:var(--a)}a{color:var(--a);text-decoration:none;font-weight:700}.result{margin:10px 0;cursor:pointer}.secret{color:var(--a2);font-size:11px;letter-spacing:.14em;text-align:center;margin-top:20px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid,.membergrid,.features,.support{grid-template-columns:1fr}.hero{padding-top:20px}.hero h1{font-size:48px}}
</style></head>
<body><div id="app" class="app"></div>
<script>
const memberData=[
['RM','Kim Namjoon','Leader • rapper • songwriter/producer','mono. • Indigo • Right Place, Wrong Person'],
['Jin','Kim Seokjin','Oldest member • vocalist','The Astronaut • Happy • Echo'],
['SUGA','Min Yoongi','Rapper • producer • songwriter • Agust D','Agust D • D-2 • D-DAY'],
['j-hope','Jung Hoseok','Rapper • dancer • performer','Hope World • Jack In The Box • HOPE ON THE STREET VOL.1'],
['Jimin','Park Jimin','Vocalist • dancer • performer','FACE • MUSE'],
['V','Kim Taehyung','Vocalist • performer','Layover • Winter Bear • Sweet Night • Christmas Tree'],
['Jung Kook','Jeon Jungkook','Youngest member • vocalist • performer','GOLDEN • Seven • 3D • Standing Next to You']];
const timelineData=[
['2013','Debut','2 COOL 4 SKOOL and “No More Dream” begin BTS’s official journey.'],
['2014','DARK & WILD','BTS expand beyond the school trilogy with their first full album.'],
['2015–16','HYYH','The Most Beautiful Moment in Life becomes a defining youth era.'],
['2016','WINGS','A new conceptual chapter explores growth, temptation and identity.'],
['2017–18','LOVE YOURSELF','Her, Tear and Answer build a story around love, heartbreak and self-love.'],
['2019–20','MAP OF THE SOUL','Persona and 7 explore identity, shadow and the different selves inside us.'],
['2020–21','Dynamite / BE / Butter','BTS reach new global milestones while making music shaped by the pandemic era.'],
['2022','Proof + Chapter 2','Proof looks back while members expand their individual activities.'],
['2023–25','Military service','Members complete required service in stages; all seven are together again by June 2025.'],
['2026','ARIRANG','BTS return with their fifth full album and a new full-group chapter.']];
const albumData=[
['2 COOL 4 SKOOL','2013','School Trilogy','No More Dream • We Are Bulletproof Pt.2'],
['DARK & WILD','2014','Early era','Danger • War of Hormone'],
['Young Forever','2016','HYYH','I NEED U • Run • Young Forever'],
['WINGS','2016','WINGS','Blood Sweat & Tears • Spring Day'],
['LOVE YOURSELF: Answer','2018','LOVE YOURSELF','IDOL • Answer: Love Myself'],
['MAP OF THE SOUL: 7','2020','MAP OF THE SOUL','ON • Black Swan • We are Bulletproof: the Eternal'],
['BE','2020','Pandemic era','Life Goes On • Blue & Grey'],
['Proof','2022','Anthology','Yet To Come • Run BTS'],
['ARIRANG','2026','Full-group return','Body to Body • NORMAL • Into the Sun']];
const songData=[
['No More Dream','2 COOL 4 SKOOL','School Trilogy'],['I NEED U','Young Forever','HYYH'],['Run','Young Forever','HYYH'],['Spring Day','WINGS era','HYYH/WINGS'],['DNA','LOVE YOURSELF: Her','LOVE YOURSELF'],['Fake Love','LOVE YOURSELF: Tear','LOVE YOURSELF'],['IDOL','LOVE YOURSELF: Answer','LOVE YOURSELF'],['Black Swan','MAP OF THE SOUL: 7','MAP OF THE SOUL'],['Life Goes On','BE','Pandemic era'],['Yet To Come','Proof','Chapter 2'],['Body to Body','ARIRANG','ARIRANG'],['NORMAL','ARIRANG','ARIRANG'],['Into the Sun','ARIRANG','ARIRANG']];
const dict={OT7:'All seven BTS members together.',ARMY:'BTS’s official fandom name, announced on July 9, 2013.',bias:'Your favorite member.', 'bias wrecker':'A member who keeps challenging your usual favorite.',maknae:'The youngest member. Jung Kook is BTS’s maknae.',hyung:'A Korean term used by a male to address an older male.',noona:'A Korean term used by a male to address an older female.',sunbae:'A person with more experience or seniority.',comeback:'A K-pop release and promotion period.',era:'A release period with its own music, visuals and themes.',daesang:'A grand-prize category at major Korean award ceremonies.',sasaeng:'A fan who seriously violates an artist’s privacy or boundaries.',akgae:'A fan who supports one member while actively attacking other members.',Borahae:'“I purple you,” a phrase associated with V.',Apobangpo:'“ARMY forever, BTS forever.”',HYYH:'화양연화 — The Most Beautiful Moment in Life.',BU:'BTS Universe, a fictional story world connected across selected works.',0613:'June 13, BTS’s debut date.'};
const sections=[
['01','Before Anything Else','The basic BTS and ARMY facts every beginner should know.','BTS is a seven-member South Korean group under BIGHIT MUSIC. They debuted on June 13, 2013. BTS originally stands for Bangtan Sonyeondan; “Beyond the Scene” was later added as another meaning. ARMY is BTS’s official fandom name.'],
['02','Meet the 7 Members','Learn the seven faces, names, roles and solo work.','Start with the Member Finder below. You do not need to memorize everything at once — voices, personalities, jokes and performances make the members easier to recognize naturally.'],
['03','BTS History','A simple journey from 2013 to the present.','BTS moved from an ambitious rookie hip-hop group into a globally recognized act through multiple musical and conceptual eras. Their history is best understood as a series of chapters rather than one straight genre.'],
['04','Discography','Albums, eras and a simple listening path.','If you are new, try a few anchor albums first: Young Forever for HYYH, WINGS, LOVE YOURSELF: Answer, MAP OF THE SOUL: 7, BE, Proof and then ARIRANG.'],
['05','BTS Eras','School Trilogy → HYYH → WINGS → LOVE YOURSELF → MAP OF THE SOUL → BE → Chapter 2 → ARIRANG.','An “era” is simply a release period with its own sound, visuals, styling and themes. You will hear ARMYs use this word constantly.'],
['06','HYYH + BU Lore','The fictional story world behind selected BTS works.','HYYH means The Most Beautiful Moment in Life. The BTS Universe is fictional; it should not be treated as a literal account of the members’ real lives.'],
['07','BTS Content to Watch','Run BTS!, Bon Voyage, In the SOOP, concerts and more.','If you want the fun side first, try Run BTS! You can then explore travel, behind-the-scenes and documentary content whenever you feel like it.'],
['08','Important BTS/ARMY Terms','OT7, bias, maknae, hyung, comeback, daesang, sasaeng and more.','Use the BTS Dictionary below whenever a word is confusing. Learning fandom vocabulary is much easier in context than by memorizing a huge list.'],
['09','Inside Jokes + Memes','The little references that make BTS content feel like home.','RJ, BT21, “I purple you,” Jin’s dad jokes, Namjoon’s destruction, Yoongi’s cat-like jokes, Hobi’s hope, Jimin’s phrases, Tae’s randomness and Jung Kook’s golden-maknae reputation are just the beginning.'],
['10','Symbols & References','7, 0613, Borahae, Magic Shop, ARMY Bomb and more.','These references appear across BTS and ARMY spaces. You will recognize them naturally as you explore the group.'],
['11','Awards & Records','Major milestones and why they mattered.','BTS have collected major Korean awards and international chart milestones. For changing totals, always check the relevant official award or chart source.'],
['12','BTS + Korean Culture','Hyung, noona, sunbae, dongsaeng and everyday Korean references.','Korean honorifics are relationship words, not just translations. Context and age/seniority matter.'],
['13','Military Service','The members’ service period and the OT7 story.','South Korean military service affected the group’s schedule in stages. The members completed service individually and the full group returned to activities in 2025.'],
['14','Solo Era / Chapter 2','Each member’s individual music and projects.','Chapter 2 gave each member more space for solo music, collaborations, performances and personal creative directions while keeping BTS as the shared group identity.'],
['15','Official Sources','Where to verify BTS information.','Use official BTS/BIGHIT/Weverse channels and primary award or chart sources for important claims. Random update accounts can be useful for discovery but should not automatically be treated as fact.'],
['16','Fan Accounts + Information Sources','Translation, update, chart and voting accounts.','Different accounts serve different purposes. Translation accounts help with Korean content; chart accounts track data; voting accounts explain current voting windows. Always check the original source when possible.'],
['17','Fandom Etiquette','Privacy, rumors, mistranslations and respect.','Do not share private information, invade boundaries or attack members or other fans. Edited screenshots, mistranslations and out-of-context clips can spread quickly.'],
['18','How to Support BTS','Listening, official content, voting, buying and sharing.','Support is optional and personal. You can stream, vote, buy, attend concerts, share official releases or simply listen to the music.'],
['19','Misinformation / Myths','How to separate claims from verified facts.','Treat rumors as rumors. For dates, awards, quotes, charts and company announcements, look for a primary or reliable source before repeating them.'],
['20','Where to Start','A simple seven-day beginner path.','Day 1: members. Day 2: major albums. Day 3: history. Day 4: Run BTS! Day 5: dictionary. Day 6: HYYH/BU. Day 7: solo work. Then go wherever your curiosity takes you.']
];
function shell(title,intro,body){app.innerHTML='<div class="reader"><button class="back" onclick="home()">← Back</button><div class="ey">0613 · BTS ARMY GUIDE</div><h1>'+title+'</h1><p class="intro">'+intro+'</p>'+body+'</div>'}
function home(){app.innerHTML='<header><div class="hero"><div class="ey">A beginner-friendly BTS & ARMY guide</div><h1>0613 — The <span>BTS ARMY</span> Guide</h1><p>Members, music, eras, lore, content, vocabulary and helpful support tools — all in one simple place.</p><div class="tags"><span class="tag">7 members</span><span class="tag">0613</span><span class="tag">Purple Side</span><span class="tag">Magic Shop</span></div></div><div class="controls"><input id="q" class="search" placeholder="Search members, songs, albums, terms..." oninput="search(this.value)"><button class="pill" onclick="start()">START THE GUIDE</button><button class="pill" onclick="support()">Support Hub</button></div><div id="results"></div><div class="grid">'+sections.map((s,i)=>'<article class="card" onclick="section('+i+')"><div class="num">'+s[0]+'</div><h2>'+s[1]+'</h2><p>'+s[2]+'</p></article>').join('')+'</div><div class="wrap"><div class="features">'+[['Member Finder','Find each member, role and solo work','members()'],['BTS Timeline','2013 → 2026','timeline()'],['Album Explorer','Album → era → key songs','album()'],['BTS Dictionary','OT7, maknae, daesang, sasaeng...','dictionary()'],['Song Finder','Find a song’s album and era','song()'],['Progress Tracker','Keep track of what you have learned','progress()'],['ARIRANG','Explore the 2026 full-group album','arirang()'],['What should I learn next?','Let the guide choose for you','randomNext()']].map(x=>'<button class="feature" onclick="'+x[2]+'"><b>'+x[0]+'</b><span>'+x[1]+'</span></button>').join('')+'</div><div class="secret">7 members · 0613 · Borahae · Magic Shop · Apobangpo</div></div></header>'}
function section(i){let s=sections[i];shell(s[1],s[2],'<div class="post"><h3>Start here</h3><p>'+s[3]+'</p></div>')}
function start(){section(0)}
function members(){shell('Member Finder','Meet the seven members, then explore their solo work.','<div class="membergrid">'+memberData.map(m=>'<div class="member"><strong>'+m[0]+'</strong><span>'+m[1]+'<br>'+m[2]+'<br><br>Solo: '+m[3]+'</span></div>').join('')+'</div>')}
function timeline(){shell('BTS Timeline','A compact chronological guide.','<div class="timeline">'+timelineData.map(x=>'<div class="post"><h3>'+x[0]+' · '+x[1]+'</h3><p>'+x[2]+'</p></div>').join('')+'</div>')}
function album(){shell('Album Explorer','Use these anchor albums to understand BTS eras.','<div class="membergrid">'+albumData.map(x=>'<div class="member"><strong>'+x[0]+'</strong><span>'+x[1]+' · '+x[2]+'<br>Key songs: '+x[3]+'</span></div>').join('')+'</div>')}
function dictionary(){shell('BTS Dictionary','Search or browse common BTS/ARMY words.','<input class="search" style="width:100%" placeholder="Search a term..." oninput="dictSearch(this.value)"><div id="dictlist" class="membergrid"></div>');dictSearch('')}
function dictSearch(q){let el=document.getElementById('dictlist');if(!el)return;let a=Object.entries(dict).filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(q.toLowerCase()));el.innerHTML=a.map(x=>'<div class="member"><strong>'+x[0]+'</strong><span>'+x[1]+'</span></div>').join('')||'<div class="post"><p>No match yet.</p></div>'}
function song(){shell('Song Finder','Search a song title.','<input class="search" style="width:100%" placeholder="Search a song..." oninput="songSearch(this.value)"><div id="songlist"></div>');songSearch('')}
function songSearch(q){let el=document.getElementById('songlist');if(!el)return;let a=songData.filter(x=>x.join(' ').toLowerCase().includes(q.toLowerCase()));el.innerHTML=a.map(x=>'<div class="result"><div class="num">'+x[2]+'</div><h3>'+x[0]+'</h3><p>'+x[1]+' · '+x[2]+'</p></div>').join('')||'<div class="post"><p>No match yet.</p></div>'}
function progress(){let items=sections.map(s=>s[0]+' · '+s[1]);shell('Progress Tracker','Check off sections as you learn. Your progress is saved in this browser.','<div class="tracker">'+items.map((x,i)=>'<label class="track"><input type="checkbox" '+(localStorage.getItem('bts'+i)?'checked':'')+' onchange="saveProgress('+i+',this.checked)"><span>'+x+'</span></label>').join('')+'</div>')}
function saveProgress(i,v){v?localStorage.setItem('bts'+i,'1'):localStorage.removeItem('bts'+i)}
function arirang(){shell('ARIRANG','A beginner-friendly overview of BTS’s 2026 full-group album.','<div class="post"><h3>Album</h3><p>ARIRANG is BTS’s fifth full album and marks their full-group return. The album connects Korean identity, connection, ambition, inner life, acceptance and hope.</p></div><div class="membergrid">'+albumData[8][3].split(' • ').map(x=>'<div class="member"><strong>'+x+'</strong><span>ARIRANG track · explore its lyrics, performance and your own interpretation.</span></div>').join('')+'</div>')}
function support(){shell('BTS Support Hub','Optional tools for supporting BTS and tracking your listening.','<div class="support"><div class="member"><strong>Voting Guide</strong><span>Find current voting opportunities, verify the event and use the official app or voting team instructions.</span><br><a href="https://linktr.ee/btsxarmyvotingteam" target="_blank">ARMY VOTING TEAM ↗</a></div><div class="member"><strong>Last.fm Guide</strong><span>Use Last.fm to scrobble music and build a personal BTS listening history.</span><br><a href="https://www.last.fm/" target="_blank">Open Last.fm ↗</a></div><div class="member"><strong>B-CD Guide</strong><span>A fan-made support/tracking project. Check its current instructions before joining any mission.</span><br><a href="https://youtu.be/8Ixup0Iy2RM?si=0SCuwDZzB7ChbsHn" target="_blank">Helpful video ↗</a></div></div><div class="post"><h3>Remember</h3><p>You do not need to do every task. Listening, watching BTS content and enjoying the music is already enough.</p></div>')}
function randomNext(){let i=Math.floor(Math.random()*sections.length);section(i)}
function search(q){let box=document.getElementById('results');if(!box)return;if(!q.trim()){box.innerHTML='';return}let a=[];sections.forEach((s,i)=>{if((s[1]+' '+s[2]+' '+s[3]).toLowerCase().includes(q.toLowerCase()))a.push('<div class="result" onclick="section('+i+')"><div class="num">'+s[0]+'</div><h3>'+s[1]+'</h3><p>'+s[2]+'</p></div>')});memberData.forEach(m=>{if(m.join(' ').toLowerCase().includes(q.toLowerCase()))a.push('<div class="result" onclick="members()"><h3>'+m[0]+'</h3><p>'+m[1]+' · '+m[2]+'</p></div>')});songData.forEach(s=>{if(s.join(' ').toLowerCase().includes(q.toLowerCase()))a.push('<div class="result" onclick="song()"><h3>'+s[0]+'</h3><p>'+s[1]+' · '+s[2]+'</p></div>')});let terms=Object.entries(dict).filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(q.toLowerCase()));terms.forEach(x=>a.push('<div class="result" onclick="dictionary()"><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div>'));box.innerHTML='<div class="wrap"><div class="post"><h3>Search results</h3><p>'+a.length+' result(s)</p></div>'+a.join('')+'</div>'}
home();
</script></body></html>
