['01','Before Anything Else','The basic BTS and ARMY facts every beginner should know.','BTS is a seven-member South Korean group under BIGHIT MUSIC. They debuted on June 13, 2013. BTS originally stands for Bangtan Sonyeondan; “Beyond the Scene” was later added as another meaning. ARMY is BTS’s official fandom name.'],

function home(){app.innerHTML='<header><div class="hero"><div class="ey">A beginner-friendly BTS & ARMY guide</div><h1>0613 — The <span>BTS ARMY</span> Guide</h1><p>Members, music, eras, lore, content, vocabulary and helpful support tools — all in one simple place.</p><div class="tags"><span class="tag">7 members</span><span class="tag">0613</span><span class="tag">Purple Side</span><span class="tag">Magic Shop</span></div><div class="badge">✦ made for ARMYs · learn at your own pace</div></div><div class="controls"><input id="q" class="search" placeholder="Search members, songs, albums, terms..." oninput="search(this.value)"><button class="pill" onclick="start()">START THE GUIDE</button><button class="pill" onclick="support()">Support Hub</button></div><div id="results"></div><div class="grid">'+sections.map((s,i)=>'<article class="card" onclick="section('+i+')"><div class="num">'+s[0]+'</div><h2>'+s[1]+'</h2><p>'+s[2]+'</p></article>').join('')+'</div><div class="wrap"><div class="features">'+[['Member Finder','Find each member, role and solo work','members()'],['BTS Timeline','2013 → 2026','timeline()'],['Album Explorer','Album → era → key songs','album()'],['BTS Dictionary','OT7, maknae, daesang, sasaeng...','dictionary()'],['Song Finder','Find a song’s album and era','song()'],['Progress Tracker','Keep track of what you have learned','progress()'],['Voting + Streaming','Voting apps, schedules and streaming resources','support()'],['Last.fm Guide','Scrobbling + the tutorial you shared','support()'],['B-CD Guide','Helpful B-CD resource','support()'],['ARIRANG','Explore the 2026 full-group album','arirang()'],['What should I learn next?','Let the guide choose for you','randomNext()']].map(x=>'<button class="feature" onclick="'+x[2]+'"><b>'+x[0]+'</b><span>'+x[1]+'</span></button>').join('')+'</div><div class="secret">7 members · 0613 · Borahae · Magic Shop · Apobangpo</div><div class="footer">Made with <span class="heart">♡</span> for ARMY · <b>made by @kookie_star715</b><br><span class="mini">BTS · ARMY · 0613</span></div></div></header>'}
